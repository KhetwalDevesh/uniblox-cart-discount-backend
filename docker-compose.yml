services:
  postgres:
    image: postgres:16-alpine
    container_name: cart-discount-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cart_discount
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # creates the extra test database on first start of an empty volume
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cart_discount"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
